      font-family: 'Prompt', sans-serif;
    }
    
    .playfair {
      font-family: 'Playfair Display', serif;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      }
      50% {
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.8);
      }
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
    
    @keyframes shimmer {
      0% {
        background-position: -200% center;
      }
      100% {
        background-position: 200% center;
      }
    }
    
    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    .animate-fade-up {
      animation: fadeInUp 0.8s ease-out forwards;
    }
    
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }
    
    .animate-pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }
    
    .animate-scale-in {
      animation: scaleIn 0.5s ease-out forwards;
    }
    
    .animate-slide-right {
      animation: slideInRight 0.5s ease-out forwards;
    }
    
    .shimmer-text {
      background: linear-gradient(90deg, #d4af37 0%, #f4e4a6 25%, #d4af37 50%, #f4e4a6 75%, #d4af37 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }
    
    .menu-card {
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .menu-card:hover {
      transform: translateY(-8px) scale(1.02);
    }
    
    .menu-card:active {
      transform: scale(0.98);
    }
    
    .tab-indicator {
      transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    .cart-bounce {
      animation: bounce 0.5s ease;
    }
    
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    
    .gradient-border {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      position: relative;
    }
    
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: linear-gradient(135deg, #d4af37, #f4e4a6, #d4af37);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    
    .page-transition {
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    
    .page-hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
      position: absolute;
    }
    
    .page-visible {
      opacity: 1;
      transform: scale(1);

      { id: 'f6', name: 'ข้าวกะเพราทะเลรวมมิตร', desc: 'กะเพราทะเลผัดเผ็ดร้อน กุ้ง ปลาหมึก หอยแมลงภู่', price: 70, emoji: '🦐', tag: '' }
    ];
    
    const drinkItems = [
      { id: 'd1', name: 'น้ำเปล่าขวดเล็ก', desc: 'น้ำดื่มสะอาดบรรจุขวด', price: 10, emoji: '💧', tag: '' },
      { id: 'd2', name: 'น้ำเปล่าขวดใหญ่', desc: 'น้ำดื่มขวดใหญ่ 1.5 ลิตร', price: 15, emoji: '💧', tag: '' },
      { id: 'd3', name: 'เป๊ปซี่ขวดเล็ก', desc: 'เป๊ปซี่เย็นชื่นใจ', price: 15, emoji: '🥤', tag: 'Popular' },
      { id: 'd4', name: 'เป๊ปซี่ขวดใหญ่', desc: 'เป๊ปซี่ขวดใหญ่ 1.25 ลิตร', price: 25, emoji: '🥤', tag: '' }
    ];
    
    function renderMenu() {
      const foodMenu = document.getElementById('food-menu');
      const drinksMenu = document.getElementById('drinks-menu');
      
      foodMenu.innerHTML = foodItems.map((item, i) => createMenuCard(item, i)).join('');
      drinksMenu.innerHTML = drinkItems.map((item, i) => createMenuCard(item, i)).join('');
    }
    
    function createMenuCard(item, index) {
      const inCart = cart.find(c => c.id === item.id);
      const quantity = inCart ? inCart.quantity : 0;
      
      return `
        <div class="menu-card bg-slate-800/50 rounded-2xl overflow-hidden border border-amber-500/10 hover:border-amber-500/40 shadow-xl" style="animation: fadeInUp 0.5s ease-out ${index * 0.1}s forwards; opacity: 0;">
          <div class="p-5">
            <div class="flex items-start justify-between mb-3">
              <div class="flex items-center gap-3">
                <span class="text-4xl">${item.emoji}</span>
                <div>
                  <h3 class="font-semibold text-amber-100 text-lg">${item.name}</h3>
                  ${item.tag ? `<span class="inline-block px-2 py-0.5 bg-amber-500/20 text-amber-400 text-xs rounded-full">${item.tag}</span>` : ''}
                </div>
              </div>
            </div>
            <p class="text-amber-100/50 text-sm mb-4 line-clamp-2">${item.desc}</p>
            <div class="flex items-center justify-between">
              <span class="playfair text-2xl font-bold text-amber-400">฿${item.price.toLocaleString()}</span>
              <div class="flex items-center gap-2">
                ${quantity > 0 ? `
                  <button onclick="updateCart('${item.id}', -1)" class="w-9 h-9 rounded-full bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold transition-all hover:scale-110 active:scale-90 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4"/></svg>
                  </button>
                  <span class="w-8 text-center font-bold text-amber-100">${quantity}</span>
                ` : ''}
                <button onclick="updateCart('${item.id}', 1)" class="w-9 h-9 rounded-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-900 font-bold transition-all hover:scale-110 active:scale-90 shadow-lg shadow-amber-500/30 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }
    
    function updateCart(itemId, delta) {
      const allItems = [...foodItems, ...drinkItems];
      const item = allItems.find(i => i.id === itemId);
      if (!item) return;
      
      const existingIndex = cart.findIndex(c => c.id === itemId);
      
      if (existingIndex >= 0) {
        cart[existingIndex].quantity += delta;
        if (cart[existingIndex].quantity <= 0) {
          cart.splice(existingIndex, 1);
        }
      } else if (delta > 0) {
        cart.push({ ...item, quantity: 1 });
      }
      
      updateCartUI();
      renderMenu();
    }
    
    function updateCartUI() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      
      const cartCount = document.getElementById('cart-count');
      const cartBar = document.getElementById('cart-bar');
      const cartBarCount = document.getElementById('cart-bar-count');
      const cartBarTotal = document.getElementById('cart-bar-total');
      
      if (count > 0) {
        cartCount.textContent = count;
        cartCount.classList.remove('hidden');
        cartCount.classList.add('cart-bounce');
        setTimeout(() => cartCount.classList.remove('cart-bounce'), 500);
        
        cartBar.classList.remove('hidden');
        cartBarCount.textContent = count;
        cartBarTotal.textContent = '฿' + total.toLocaleString();
      } else {
        cartCount.classList.add('hidden');
        cartBar.classList.add('hidden');
      }
    }
    
    function showCart() {
      const modal = document.getElementById('cart-modal');
      const cartItems = document.getElementById('cart-items');
      const cartEmpty = document.getElementById('cart-empty');
      const cartFooter = document.getElementById('cart-footer');
      const cartTotal = document.getElementById('cart-total');
      
      modal.classList.remove('hidden');
      
      if (cart.length === 0) {
        cartItems.classList.add('hidden');
        cartFooter.classList.add('hidden');
        cartEmpty.classList.remove('hidden');
      } else {
        cartEmpty.classList.add('hidden');
        cartItems.classList.remove('hidden');
        cartFooter.classList.remove('hidden');
        
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        cartTotal.textContent = '฿' + total.toLocaleString();
        
        cartItems.innerHTML = cart.map(item => `
          <div class="flex items-center gap-4 bg-slate-800/50 rounded-xl p-4 border border-amber-500/10">
            <span class="text-3xl">${item.emoji}</span>
            <div class="flex-1">
              <h4 class="font-semibold text-amber-100">${item.name}</h4>
              <p class="text-amber-400 font-medium">฿${item.price.toLocaleString()}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="updateCartFromModal('${item.id}', -1)" class="w-8 h-8 rounded-full bg-slate-700 hover:bg-slate-600 text-amber-400 flex items-center justify-center transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4"/></svg>
              </button>
              <span class="w-6 text-center font-bold text-amber-100">${item.quantity}</span>
              <button onclick="updateCartFromModal('${item.id}', 1)" class="w-8 h-8 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-900 flex items-center justify-center transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg>
              </button>
            </div>
          </div>
        `).join('');
      }
    }
    
    function updateCartFromModal(itemId, delta) {
      updateCart(itemId, delta);
      showCart();
    }
    
    function hideCart() {
      document.getElementById('cart-modal').classList.add('hidden');
    }
    
    function selectTable(tableNumber) {
      selectedTable = tableNumber;
      
      const tableButtons = document.querySelectorAll('.table-btn');
      tableButtons.forEach(btn => {
        const btnTable = parseInt(btn.dataset.table);
        if (btnTable === tableNumber) {
          btn.classList.remove('bg-slate-800', 'border-amber-500/20');
          btn.classList.add('bg-gradient-to-br', 'from-amber-500', 'to-amber-600', 'border-amber-400', 'scale-105', 'shadow-lg', 'shadow-amber-500/30');
          const span = btn.querySelector('span');
          span.classList.remove('text-amber-100');
          span.classList.add('text-slate-900');
        } else {
          btn.classList.add('bg-slate-800', 'border-amber-500/20');
          btn.classList.remove('bg-gradient-to-br', 'from-amber-500', 'to-amber-600', 'border-amber-400', 'scale-105', 'shadow-lg', 'shadow-amber-500/30');
          const span = btn.querySelector('span');
          span.classList.remove('text-slate-900');
          span.classList.add('text-amber-100');
        }
      });
      
      const confirmBtnText = document.getElementById('confirm-btn-text');
      confirmBtnText.textContent = `ยืนยันคำสั่งซื้อ (โต๊ะ ${tableNumber})`;
    }
    
    function placeOrder() {
      if (cart.length === 0) return;
      
      const orderId = Date.now();
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      
      const orderData = {
        id: orderId,
        items: cart,
        table: selectedTable || 'ไม่ระบุ',
        total: total,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        status: 'pending',
        createdAt: new Date().toISOString()
      };
      
      // บันทึกลง Firebase
      database.ref('orders/' + orderId).set(orderData)
        .then(() => {
          console.log('✅ Order saved to Firebase!');
          
          // Clear cart
          hideCart();
          cart = [];
          selectedTable = null;
          updateCartUI();
          renderMenu();
          
          // Reset button text
          const confirmBtnText = document.getElementById('confirm-btn-text');
          if (confirmBtnText) {
            confirmBtnText.textContent = 'ยืนยันคำสั่งซื้อ';
          }
          
          // Show success modal
          const successModal = document.getElementById('success-modal');
          successModal.classList.remove('hidden');
          successModal.classList.add('flex');
        })
        .catch((error) => {
          console.error('❌ Error saving order:', error);
          alert('เกิดข้อผิดพลาดในการส่งคำสั่งซื้อ กรุณาลองอีกครั้ง');
        });
    }
    
    function closeSuccessModal() {
      const successModal = document.getElementById('success-modal');
      successModal.classList.add('hidden');
      successModal.classList.remove('flex');
    }
    
    function switchTab(tab) {
      currentTab = tab;
      const indicator = document.getElementById('tab-indicator');
      const foodMenu = document.getElementById('food-menu');
      const drinksMenu = document.getElementById('drinks-menu');
      const foodTabText = document.getElementById('food-tab-text');
      const drinksTabText = document.getElementById('drinks-tab-text');
      
      if (tab === 'food') {
        indicator.style.transform = 'translateX(0)';
        foodMenu.classList.remove('hidden');
        drinksMenu.classList.add('hidden');
        foodTabText.classList.remove('text-amber-100/70');
        foodTabText.classList.add('text-slate-900');
        drinksTabText.classList.add('text-amber-100/70');
        drinksTabText.classList.remove('text-slate-900');
      } else {
        indicator.style.transform = 'translateX(100%)';
        foodMenu.classList.add('hidden');
        drinksMenu.classList.remove('hidden');
        drinksTabText.classList.remove('text-amber-100/70');
        drinksTabText.classList.add('text-slate-900');
        foodTabText.classList.add('text-amber-100/70');
        foodTabText.classList.remove('text-slate-900');
      }
    }
    
    function showMainApp() {
      const splash = document.getElementById('splash-screen');
      const main = document.getElementById('main-app');
      
      splash.classList.add('page-hidden');
      splash.classList.remove('page-visible');
      
      setTimeout(() => {
        main.classList.remove('page-hidden');
        main.classList.add('page-visible');
      }, 300);
    }
    
    // Initialize after DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      renderMenu();
    });
  </script>
</body>
</html>
